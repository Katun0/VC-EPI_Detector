<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Analysis Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Cabeção e os Botão -->
        <div class="header">
            <button id="btn-webcam">
                <span class="status-dot"></span>
                Abrir WebCam
            </button>
            <button id="btn-import">
                Importar Vídeo
            </button>
        </div>

        <!-- Player -->
        <div class="video-player">
            <span>Aguardando sinal de vídeo...</span>
        </div>

        <!-- Dados -->
        <div class="inference-data">
            <span>Dados de Inferência &bull; Gráficos Matplotlib</span>
        </div>
    </div>
</body>
</html>
